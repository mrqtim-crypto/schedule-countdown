    }

      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 20px);
    }

      min-height: 64px;
      transition: all 0.15s ease-in-out;
    }
    @media (max-width: 640px) {
      .cal-cell {
        min-height: 54px;
      }
    }

    @keyframes slideInRight {
      from { opacity: 0.25; transform: translateX(24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0.25; transform: translateX(-24px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .slide-in-right {
      animation: slideInRight 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-in-left {
      animation: slideInLeft 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;

    // 目前月曆瀏覽年份與月份
    let currentCalYear = new Date().getFullYear();
    let currentCalMonth = new Date().getMonth(); // 0-indexed

    // SHA-256 密碼雜湊運算
    async function sha256(str) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 初始化
    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      checkAuth();
      setupPinInput();
    });

    function checkAuth() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === AUTH_HASH) {
        unlockPortal();
      }
    }

    function setupPinInput() {
      const pin = document.getElementById("pinInput");
      pin.addEventListener("input", (e) => {
        updateDots(e.target.value.length);
        if (e.target.value.length === 4) {
          verifyPassword();
        }
      });
    }

    function updateDots(length) {
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById(`dot${i}`);
        if (i <= length) {
          dot.classList.add("bg-slate-900", "border-slate-900", "scale-110");
        } else {
          dot.classList.remove("bg-slate-900", "border-slate-900", "scale-110");
        }
      }
    }

    async function verifyPassword() {
      const pin = document.getElementById("pinInput").value;
      const errorMsg = document.getElementById("errorMsg");
      const lockCard = document.getElementById("lockCard");
      
      const hashed = await sha256(pin);
      if (hashed === AUTH_HASH) {
        if (document.getElementById("rememberMe").checked) {
          localStorage.setItem(STORAGE_KEY, AUTH_HASH);
        }
        unlockPortal();
      } else {
        errorMsg.classList.remove("opacity-0");
        lockCard.classList.add("shake");
        setTimeout(() => lockCard.classList.remove("shake"), 400);
        document.getElementById("pinInput").value = "";
        updateDots(0);
      }
    }

      document.getElementById("lockScreen").classList.add("opacity-0", "pointer-events-none");
      setTimeout(() => {
        document.getElementById("lockScreen").style.display = "none";
      }, 300);
      document.getElementById("mainDashboard").classList.remove("hidden");
      renderPortal();
      renderCalendar(currentCalYear, currentCalMonth);
      setupCalendarGestures();
      startTimers();
      fetchLiveCalendarEvents();
    }

    // 連線 Google Apps Script 即時 API 取得最新日曆
    async function fetchLiveCalendarEvents() {
      if (!GAS_API_URL) return;
      const statusText = document.getElementById("syncStatusText");
      const statusDot = document.getElementById("syncStatusDot");
      if (statusText) statusText.textContent = "即時同步中...";
      if (statusDot) statusDot.className = "inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse";

      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();
        if (data && data.status === "success" && Array.isArray(data.events)) {
          EVENTS_DATA = data.events;
          renderPortal();
          renderCalendar(currentCalYear, currentCalMonth);
          if (statusText) statusText.textContent = "已連線 Google 日曆 (即時)";
          if (statusDot) statusDot.className = "inline-block w-2 h-2 rounded-full bg-emerald-500";
        }
      } catch (e) {
        console.warn("無法取得 Google 日曆即時資料，使用快取資料:", e);
        if (statusText) statusText.textContent = "Google 日曆同步中";
        if (statusDot) statusDot.className = "inline-block w-2 h-2 rounded-full bg-emerald-500";
      }
    }

    // 設定 / 更改 Google Apps Script Web App 網址
    function promptSetGasUrl() {
      const current = localStorage.getItem("gas_api_url") || "";
      const input = prompt("請輸入 Google Apps Script 網頁應用程式網址 (Web App URL)：", current);
      if (input !== null) {
        const trimmed = input.trim();
        if (trimmed) {
          localStorage.setItem("gas_api_url", trimmed);
          GAS_API_URL = trimmed;
          fetchLiveCalendarEvents();
          alert("已儲存即時同步 API 網址！正在連線抓取最新行程...");
        } else {
          localStorage.removeItem("gas_api_url");
          GAS_API_URL = "";
          alert("已清除即時同步 API 網址，將使用預設資料。");
          location.reload();
        }
      }
    }

    function lockPortal() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    // ==================== 月曆繪製與切換邏輯 (支援手勢滑動) ====================
    function prevMonth() {
      currentCalMonth--;
      if (currentCalMonth < 0) {
        currentCalMonth = 11;
        currentCalYear--;
      }
      renderCalendar(currentCalYear, currentCalMonth, 'prev');
    }

    function nextMonth() {
      currentCalMonth++;
      if (currentCalMonth > 11) {
        currentCalMonth = 0;
        currentCalYear++;
      }
      renderCalendar(currentCalYear, currentCalMonth, 'next');
    }

    function goToCurrentMonth() {
      const now = new Date();
      currentCalYear = now.getFullYear();
      currentCalMonth = now.getMonth();
      renderCalendar(currentCalYear, currentCalMonth);
    }

    function renderCalendar(year, month, direction = null) {
      document.getElementById("calendarMonthTitle").textContent = `${year} 年 ${month + 1} 月`;
      const grid = document.getElementById("calendarGrid");
      grid.innerHTML = "";

      // 換月滑動過渡動畫
      grid.classList.remove("slide-in-right", "slide-in-left");
      if (direction === 'next') {
        void grid.offsetWidth; // trigger reflow
        grid.classList.add("slide-in-right");
      } else if (direction === 'prev') {
        void grid.offsetWidth;
        grid.classList.add("slide-in-left");
      }

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      // 取得該月第一天是星期幾 (0=日, 1=一, ...)
      const firstDayOfWeek = new Date(year, month, 1).getDay();
      // 取得該月總天數
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      // 取得上個月總天數
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      // 1. 填補上個月的尾巴
      for (let i = firstDayOfWeek - 1; i >= 0; i--) {
        const d = daysInPrevMonth - i;
        const cell = document.createElement("div");
        cell.className = "cal-cell p-1 rounded-xl bg-slate-50/50 text-slate-300 flex flex-col justify-start items-center";
        cell.innerHTML = `<span class="text-[11px] font-medium">${d}</span>`;
        grid.appendChild(cell);
      }

      // 2. 當月所有日期
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month, day).getDay();
        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        const isToday = (dateStr === todayStr);

        // 檢查特殊節日
        const holidayName = HOLIDAYS[dateStr];

        // 檢查是否有 Google 日曆行程
        const dayEvents = EVENTS_DATA.filter(e => {
          const startStr = e.startDate.substring(0, 10);
          const endStr = e.endDate.substring(0, 10);
          return dateStr >= startStr && dateStr <= endStr;
        });

        const cell = document.createElement("div");
        const cellBg = isToday ? "bg-blue-50/80 border border-blue-300/80" : (dayEvents.length > 0 ? "bg-white border border-slate-200 shadow-sm" : "bg-white/60 hover:bg-white border border-slate-100");
        cell.className = `cal-cell p-1 sm:p-1.5 rounded-xl ${cellBg} flex flex-col justify-start items-center relative overflow-hidden`;

        // 日期數字
        let dateNumClass = "text-xs font-semibold ";
        if (isToday) {
          dateNumClass += "w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold";
        } else if (holidayName || isWeekend) {
          dateNumClass += "text-rose-600";
        } else {
          dateNumClass += "text-slate-800";
        }

        let innerHTML = `<span class="${dateNumClass}">${day}</span>`;

        // 特殊節日文字 (最多顯示 4 個字)
        if (holidayName) {
          innerHTML += `<span class="text-[9px] font-bold text-rose-500 truncate max-w-full leading-tight mt-0.5" title="${holidayName}">${holidayName}</span>`;
        }

        // Google 日曆活動標記
        if (dayEvents.length > 0) {
          dayEvents.forEach(ev => {
            const isWork = ev.type === "work";
            const badgeBg = isWork ? "bg-rose-50 text-rose-700 border-rose-200" : "bg-sky-50 text-sky-700 border-sky-200";
            innerHTML += `
              <div 
                onclick="scrollToEvent('card-${ev.id}')"
                class="mt-1 w-full text-[9px] sm:text-[10px] font-bold px-1 py-0.5 rounded-md ${badgeBg} border truncate cursor-pointer hover:opacity-80 transition-opacity" 
                title="${ev.title} (${ev.location})"
              >
                ${ev.title}
              </div>
            `;
          });
        }

        cell.innerHTML = innerHTML;
        grid.appendChild(cell);
      }

      // 3. 填補下個月開頭使其補滿 7 的倍數 (保持月曆高度整齊)
      const totalCells = firstDayOfWeek + daysInMonth;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let day = 1; day <= nextDays; day++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell p-1 rounded-xl bg-slate-50/50 text-slate-300 flex flex-col justify-start items-center";
        cell.innerHTML = `<span class="text-[11px] font-medium">${day}</span>`;
        grid.appendChild(cell);
      }

      lucide.createIcons();
    }

    function scrollToEvent(cardId) {
      const elem = document.getElementById(cardId);
      if (elem) {
        elem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        elem.classList.add("ring-2", "ring-blue-500");
        setTimeout(() => elem.classList.remove("ring-2", "ring-blue-500"), 1500);
      }
    }

    // 設定行事曆左右滑動手勢 (支援 iOS 觸控滑動 & 電腦滑鼠拖曳)
    function setupCalendarGestures() {
      const section = document.getElementById("calendarSection");
      if (!section || section.dataset.gestureBound) return;
      section.dataset.gestureBound = "true";

      let startX = 0;
      let startY = 0;
      let isSwiping = false;

      // 手機觸控開始
      section.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          isSwiping = true;
        }
      }, { passive: true });

      // 手機觸控移動中
      section.addEventListener("touchmove", (e) => {
        if (!isSwiping || e.touches.length !== 1) return;
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const diffX = currentX - startX;
        const diffY = currentY - startY;

        // 若垂直滑動幅度過大，判定使用者意圖為滾動頁面，取消換月手勢
        if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 25) {
          isSwiping = false;
        }
      }, { passive: true });

      // 手機觸控結束
      section.addEventListener("touchend", (e) => {
        if (!isSwiping) return;
        isSwiping = false;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const diffX = endX - startX;
        const diffY = endY - startY;

        // 水平滑動超過 40px 且以水平移動為主
        if (Math.abs(diffX) >= 40 && Math.abs(diffX) > Math.abs(diffY) * 1.2) {
          if (diffX < 0) {
            nextMonth(); // 向左滑動 -> 下個月
          } else {
            prevMonth(); // 向右滑動 -> 上個月
          }
        }
      }, { passive: true });

      // 電腦滑鼠拖曳支援
      let mouseStartX = 0;
      let isMouseDown = false;

      section.addEventListener("mousedown", (e) => {
        // 點擊按鈕時不觸發拖曳
        if (e.target.closest("button") || e.target.closest("a")) return;
        mouseStartX = e.clientX;
        isMouseDown = true;
      });

      section.addEventListener("mouseup", (e) => {
        if (!isMouseDown) return;
        isMouseDown = false;
        const diffX = e.clientX - mouseStartX;
        if (Math.abs(diffX) >= 45) {
          if (diffX < 0) {
            nextMonth();
          } else {
            prevMonth();
          }
        }
      });

      section.addEventListener("mouseleave", () => {
        isMouseDown = false;
      });
    }

    // ==================== 倒數清單渲染邏輯 ====================
    function renderPortal() {
      const now = new Date();

      // 1. 排除已結束行程 (結束時間大於等於現在)
      const upcomingEvents = EVENTS_DATA.filter(e => new Date(e.endDate || e.startDate) >= now);

      // 2. 依倒數天數依序排列 (由近至遠)
      upcomingEvents.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

      const listContainer = document.getElementById("eventsList");
      const emptyState = document.getElementById("emptyState");
      const countBadge = document.getElementById("eventCountBadge");
      listContainer.innerHTML = "";

      if (upcomingEvents.length === 0) {
        emptyState.classList.remove("hidden");
        countBadge.textContent = "0 筆";
        return;
      } else {
        emptyState.classList.add("hidden");
        countBadge.textContent = `共 ${upcomingEvents.length} 筆待辦`;
      }

      upcomingEvents.forEach((event, idx) => {
        // 分類樣式（拍攝工作：粉色；旅行：淺藍色）
        const categoryBadge = event.type === "work" 
          ? `<span class="inline-flex items-center text-xs font-semibold px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200/80"><span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5"></span>拍攝工作</span>`
          : `<span class="inline-flex items-center text-xs font-semibold px-2.5 py-0.5 rounded-full bg-sky-50 text-sky-600 border border-sky-200/80"><span class="w-1.5 h-1.5 rounded-full bg-sky-500 mr-1.5"></span>旅行</span>`;

        const card = document.createElement("div");
        card.id = `card-${event.id}`;
        card.className = "white-card rounded-2xl p-5 transition-all";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <!-- 左側行程詳情 -->
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-2">
                ${categoryBadge}
                <span class="text-xs font-medium text-slate-500">${event.dateString}</span>
              </div>
              <h3 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight leading-snug break-words">${event.title}</h3>
              <p class="text-xs text-slate-500 mt-1 flex items-center">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400 mr-1 flex-shrink-0"></i>
                <span class="truncate">${event.location}</span>
              </p>
            </div>

            <!-- 右側倒數計時與日曆按鈕 -->
            <div class="flex flex-col items-end flex-shrink-0">
              <div class="text-right">
                <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider block">剩餘倒數</span>
                <span id="countdown-${event.id}" class="text-base font-extrabold font-mono text-slate-900 block mt-0.5">計算中...</span>
              </div>
              <a 
                href="${event.calLink}" 
                target="_blank" 
                class="mt-2.5 inline-flex items-center space-x-1 text-xs text-blue-600 hover:text-blue-700 bg-blue-50/80 hover:bg-blue-100/80 px-2.5 py-1 rounded-lg transition-colors font-medium"
                title="查看 Google 日曆活動"
              >
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <span>日曆</span>
              </a>
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    // 每秒動態刷新倒數天/時/分/秒
    function startTimers() {
      updateCountdowns();
      setInterval(updateCountdowns, 1000);
    }

    function updateCountdowns() {
      const now = new Date();
      
      const timeElem = document.getElementById("currentTimeDisplay");
      if (timeElem) {
        timeElem.textContent = now.toLocaleDateString("zh-TW", { month: "numeric", day: "numeric", weekday: "short" }) + " " + now.toTimeString().substring(0, 8);
      }

      EVENTS_DATA.forEach(event => {
        const span = document.getElementById(`countdown-${event.id}`);
        if (!span) return;
        const diff = new Date(event.startDate) - now;
        if (diff > 0) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const mins = Math.floor((diff / 1000 / 60) % 60);
          const secs = Math.floor((diff / 1000) % 60);
          span.innerHTML = `<span class="text-rose-600 text-lg">${days}</span><span class="text-xs text-slate-400 font-sans mx-0.5">天</span> <span class="text-sm font-semibold">${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}</span>`;
        } else {
          span.textContent = "進行中 / 今日";
          span.className = "text-xs font-semibold text-emerald-600 block mt-0.5";
        }
      });
    }
  </script>
