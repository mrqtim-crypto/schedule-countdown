<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>行程倒數看板 | Mr. Q</title>
  
  <!-- iOS PWA / Web Clip Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="行程倒數">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #f8fafc;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
    }
    
    .white-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.03);
    }

    .white-card:hover {
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
      border-color: #cbd5e1;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 20px);
    }
  </style>
</head>
<body class="antialiased selection:bg-blue-100 selection:text-blue-900">

  <!-- ==================== 鎖定解鎖畫面 (白色簡約 PIN 碼) ==================== -->
  <div id="lockScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md transition-opacity duration-300">
    <div id="lockCard" class="w-full max-w-sm bg-white rounded-3xl p-8 text-center flex flex-col items-center shadow-2xl border border-slate-100">
      
      <!-- Lock Icon -->
      <div class="w-14 h-14 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 mb-5 shadow-sm">
        <i data-lucide="lock" class="w-7 h-7"></i>
      </div>

      <h1 class="text-xl font-bold tracking-tight text-slate-900 mb-1">行程倒數看板</h1>
      <p class="text-xs text-slate-500 mb-6">請輸入安全密碼以解鎖行程</p>

      <!-- PIN Indicator Dots -->
      <div class="flex justify-center space-x-3.5 mb-6">
        <div id="dot1" class="w-3 h-3 rounded-full border-2 border-slate-300 transition-all duration-200"></div>
        <div id="dot2" class="w-3 h-3 rounded-full border-2 border-slate-300 transition-all duration-200"></div>
        <div id="dot3" class="w-3 h-3 rounded-full border-2 border-slate-300 transition-all duration-200"></div>
        <div id="dot4" class="w-3 h-3 rounded-full border-2 border-slate-300 transition-all duration-200"></div>
      </div>

      <!-- Password Input Form -->
      <form id="authForm" onsubmit="event.preventDefault(); verifyPassword();" class="w-full">
        <input 
          type="password" 
          id="pinInput" 
          maxlength="8" 
          pattern="[0-9]*" 
          inputmode="numeric" 
          autocomplete="current-password"
          placeholder="輸入 4 位數密碼" 
          class="w-full text-center tracking-widest text-lg py-3 px-4 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 mb-2 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all"
        />
        
        <p id="errorMsg" class="text-xs text-rose-500 h-5 opacity-0 transition-opacity">密碼錯誤，請重新輸入</p>

        <!-- Unlock Button -->
        <button 
          type="button" 
          onclick="verifyPassword()" 
          class="w-full mt-1 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-medium shadow-md shadow-slate-900/10 transition-all active:scale-[0.98] flex items-center justify-center space-x-2"
        >
          <span>解鎖查看</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Remember device checkbox -->
      <label class="flex items-center space-x-2 mt-5 cursor-pointer text-xs text-slate-500">
        <input type="checkbox" id="rememberMe" checked class="rounded border-slate-300 text-slate-900 focus:ring-0">
        <span>記住此裝置（下次免輸入）</span>
      </label>
    </div>
  </div>

  <!-- ==================== 主要清單畫面 (白色系乾淨排版) ==================== -->
  <div id="mainDashboard" class="hidden min-h-screen flex flex-col pt-safe pb-safe px-4 sm:px-6 max-w-2xl mx-auto">
    
    <!-- Top Navigation Bar -->
    <header class="flex items-center justify-between py-6 border-b border-slate-200/80 mb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">行程倒數</h1>
        <p class="text-xs text-slate-500 mt-0.5 flex items-center space-x-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>Google 日曆同步中</span>
          <span class="text-slate-300">|</span>
          <span id="currentTimeDisplay" class="font-mono text-slate-400"></span>
        </p>
      </div>

      <div class="flex items-center space-x-2">
        <a 
          href="https://calendar.google.com/" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="p-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 transition-all text-xs flex items-center space-x-1 shadow-sm"
          title="開啟 Google 日曆"
        >
          <i data-lucide="calendar" class="w-4 h-4 text-blue-600"></i>
          <span class="hidden sm:inline font-medium">日曆</span>
        </a>
        <button 
          onclick="lockPortal()" 
          class="p-2.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-500 hover:text-rose-600 transition-all text-xs flex items-center space-x-1 shadow-sm"
          title="重新上鎖"
        >
          <i data-lucide="lock" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Events List: 依倒數天數排序 (僅顯示未結束行程) -->
    <main class="flex-1">
      <div id="eventsList" class="space-y-4">
        <!-- Rendered dynamically by JavaScript -->
      </div>

      <!-- 空白狀態 (如果沒有未來的行程) -->
      <div id="emptyState" class="hidden text-center py-16">
        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mx-auto mb-3">
          <i data-lucide="calendar-check" class="w-6 h-6"></i>
        </div>
        <p class="text-slate-600 font-medium">目前沒有待辦的未結束行程</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-16 py-6 text-center text-xs text-slate-400 border-t border-slate-200/60">
      <p>依倒數天數依序排列・每秒動態刷新</p>
    </footer>

  </div>

  <!-- ==================== JavaScript 核心邏輯 ==================== -->
  <script>
    // 密碼 SHA-256 Hash ("0310" 的 Hash 值)
    const AUTH_HASH = "408a5ee676694af19215cb22b2cd871e39c693f907933583ece00eda8d73ee16";
    const STORAGE_KEY = "schedule_auth_token_0310";

    // 7 筆同步至 Google 日曆的行程資料庫
    const EVENTS_DATA = [
      {
        id: "echn0r6ug7nkkugce6f95oiugo",
        title: "內湖週歲拍攝",
        category: "拍攝工作",
        type: "work",
        startDate: "2026-10-18T00:00:00",
        endDate: "2026-10-18T23:59:59",
        dateString: "2026/10/18 (日)",
        location: "台北市內湖區",
        calLink: "https://www.google.com/calendar/event?eid=ZWNobjByNnVnN25ra3VnY2U2Zjk1b2l1Z28gbXJxdGltQG0"
      },
      {
        id: "panreg9jki5af1iqpgm8pj9nt0",
        title: "訂婚儀式+午宴",
        category: "拍攝工作",
        type: "work",
        startDate: "2026-11-01T00:00:00",
        endDate: "2026-11-01T23:59:59",
        dateString: "2026/11/01 (日)",
        location: "基隆彭園",
        calLink: "https://www.google.com/calendar/event?eid=cGFucmVnOWpraTVhZjFpcXBnbThwajludDAgbXJxdGltQG0"
      },
      {
        id: "bgug42mmophmt0pcsdvbn2gq20",
        title: "迎娶儀式+午宴 (11/7中午搭高鐵下高雄)",
        category: "拍攝工作",
        type: "work",
        startDate: "2026-11-07T00:00:00",
        endDate: "2026-11-08T23:59:59",
        dateString: "2026/11/07 – 11/08 (跨日)",
        location: "高雄",
        calLink: "https://www.google.com/calendar/event?eid=Ymd1ZzQybW1vcGhtdDBwY3NkdmJuMmdxMjAgbXJxdGltQG0"
      },
      {
        id: "oojkhdud9v7h6fdtqovf3kqvok",
        title: "訂婚儀式+證婚+晚宴",
        category: "拍攝工作",
        type: "work",
        startDate: "2026-11-29T00:00:00",
        endDate: "2026-11-29T23:59:59",
        dateString: "2026/11/29 (日)",
        location: "台北",
        calLink: "https://www.google.com/calendar/event?eid=b29qa2hkdWQ5djdoNmZkdHFvdmYza3F2b2sgbXJxdGltQG0"
      },
      {
        id: "hosp9mmqthtqtldpru7gqsoqqk",
        title: "靜心同學會",
        category: "聚會活動",
        type: "work",
        startDate: "2026-12-19T11:30:00",
        endDate: "2026-12-19T14:30:00",
        dateString: "2026/12/19 (六) 11:30",
        location: "大院子老屋餐廳",
        calLink: "https://www.google.com/calendar/event?eid=aG9zcDltbXF0aHRxdGxkcHJ1N2dxc29xcWsgbXJxdGltQG0"
      },
      {
        id: "eu7j2h0md9eqfhv9bclndk816s",
        title: "訂婚儀式+午宴 (前一晚下台中午要訂房間)",
        category: "拍攝工作",
        type: "work",
        startDate: "2026-12-20T00:00:00",
        endDate: "2026-12-20T23:59:59",
        dateString: "2026/12/20 (日)",
        location: "台中林皇宮",
        calLink: "https://www.google.com/calendar/event?eid=ZXU3ajJoMG1kOWVxZmh2OWJjbG5kazgxNnMgbXJxdGltQG0"
      },
      {
        id: "re36eiur2a7jjqvubvhbbbtab0",
        title: "純午宴",
        category: "拍攝工作",
        type: "work",
        startDate: "2027-04-25T00:00:00",
        endDate: "2027-04-25T23:59:59",
        dateString: "2027/04/25 (日)",
        location: "君品酒店(京站)",
        calLink: "https://www.google.com/calendar/event?eid=cmUzNmVpdXIyYTdqanF2dWJ2aGJiYnRhYjAgbXJxdGltQG0"
      }
    ];

    // SHA-256 密碼雜湊運算
    async function sha256(str) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 檢查登入狀態
    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      checkAuth();
      setupPinInput();
    });

    function checkAuth() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === AUTH_HASH) {
        unlockPortal();
      }
    }

    function setupPinInput() {
      const pin = document.getElementById("pinInput");
      pin.addEventListener("input", (e) => {
        updateDots(e.target.value.length);
        if (e.target.value.length === 4) {
          verifyPassword();
        }
      });
    }

    function updateDots(length) {
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById(`dot${i}`);
        if (i <= length) {
          dot.classList.add("bg-slate-900", "border-slate-900", "scale-110");
        } else {
          dot.classList.remove("bg-slate-900", "border-slate-900", "scale-110");
        }
      }
    }

    async function verifyPassword() {
      const pin = document.getElementById("pinInput").value;
      const errorMsg = document.getElementById("errorMsg");
      const lockCard = document.getElementById("lockCard");
      
      const hashed = await sha256(pin);
      if (hashed === AUTH_HASH) {
        if (document.getElementById("rememberMe").checked) {
          localStorage.setItem(STORAGE_KEY, AUTH_HASH);
        }
        unlockPortal();
      } else {
        errorMsg.classList.remove("opacity-0");
        lockCard.classList.add("shake");
        setTimeout(() => lockCard.classList.remove("shake"), 400);
        document.getElementById("pinInput").value = "";
        updateDots(0);
      }
    }

    function unlockPortal() {
      document.getElementById("lockScreen").classList.add("opacity-0", "pointer-events-none");
      setTimeout(() => {
        document.getElementById("lockScreen").style.display = "none";
      }, 300);
      document.getElementById("mainDashboard").classList.remove("hidden");
      renderPortal();
      startTimers();
    }

    function lockPortal() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    // 渲染頁面：僅過濾未結束行程，並依倒數天數依序排列
    function renderPortal() {
      const now = new Date();

      // 1. 排除已結束行程 (結束時間大於等於現在)
      const upcomingEvents = EVENTS_DATA.filter(e => new Date(e.endDate || e.startDate) >= now);

      // 2. 依倒數天數依序排列 (由近至遠)
      upcomingEvents.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

      const listContainer = document.getElementById("eventsList");
      const emptyState = document.getElementById("emptyState");
      listContainer.innerHTML = "";

      if (upcomingEvents.length === 0) {
        emptyState.classList.remove("hidden");
        return;
      } else {
        emptyState.classList.add("hidden");
      }

      upcomingEvents.forEach((event, idx) => {
        const target = new Date(event.startDate);
        const diffDays = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
        
        // 分類樣式（拍攝工作：粉色；旅行：淺藍色）
        const categoryBadge = event.type === "work" 
          ? `<span class="inline-flex items-center text-xs font-semibold px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200/80"><span class="w-1.5 h-1.5 rounded-full bg-rose-500 mr-1.5"></span>拍攝工作</span>`
          : `<span class="inline-flex items-center text-xs font-semibold px-2.5 py-0.5 rounded-full bg-sky-50 text-sky-600 border border-sky-200/80"><span class="w-1.5 h-1.5 rounded-full bg-sky-500 mr-1.5"></span>旅行</span>`;

        const card = document.createElement("div");
        card.className = "white-card rounded-2xl p-5 transition-all";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-4">
            <!-- 左側行程詳情 -->
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-2">
                ${categoryBadge}
                <span class="text-xs font-medium text-slate-500">${event.dateString}</span>
              </div>
              <h3 class="text-lg font-bold text-slate-900 tracking-tight leading-snug truncate">${event.title}</h3>
              <p class="text-xs text-slate-500 mt-1 flex items-center">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400 mr-1 flex-shrink-0"></i>
                <span class="truncate">${event.location}</span>
              </p>
            </div>

            <!-- 右側倒數計時與日曆按鈕 -->
            <div class="flex flex-col items-end flex-shrink-0">
              <div class="text-right">
                <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider block">剩餘倒數</span>
                <span id="countdown-${event.id}" class="text-base font-extrabold font-mono text-slate-900 block mt-0.5">計算中...</span>
              </div>
              <a 
                href="${event.calLink}" 
                target="_blank" 
                class="mt-2.5 inline-flex items-center space-x-1 text-xs text-blue-600 hover:text-blue-700 bg-blue-50/80 hover:bg-blue-100/80 px-2.5 py-1 rounded-lg transition-colors font-medium"
                title="查看 Google 日曆活動"
              >
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                <span>日曆</span>
              </a>
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });

      lucide.createIcons();
    }

    // 每秒動態刷新倒數天/時/分/秒
    function startTimers() {
      updateCountdowns();
      setInterval(updateCountdowns, 1000);
    }

    function updateCountdowns() {
      const now = new Date();
      
      const timeElem = document.getElementById("currentTimeDisplay");
      if (timeElem) {
        timeElem.textContent = now.toLocaleDateString("zh-TW", { month: "numeric", day: "numeric", weekday: "short" }) + " " + now.toTimeString().substring(0, 8);
      }

      EVENTS_DATA.forEach(event => {
        const span = document.getElementById(`countdown-${event.id}`);
        if (!span) return;
        const diff = new Date(event.startDate) - now;
        if (diff > 0) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const mins = Math.floor((diff / 1000 / 60) % 60);
          const secs = Math.floor((diff / 1000) % 60);
          span.innerHTML = `<span class="text-rose-600 text-lg">${days}</span><span class="text-xs text-slate-400 font-sans mx-0.5">天</span> <span class="text-sm font-semibold">${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}</span>`;
        } else {
          span.textContent = "進行中 / 今日";
          span.className = "text-xs font-semibold text-emerald-600 block mt-0.5";
        }
      });
    }
  </script>
</body>
</html>
